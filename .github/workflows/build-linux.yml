name: Linux CI

on:
  push:
    branches: [ "devel", "master" ]
  pull_request:
    branches: [ "devel", "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  DRUMSTICKNAME: DrumstickV2
  SONIVOXNAME: SonivoxV4
  DRUMSTICK_LOCATION: ${{github.workspace}}/DrumstickV2
  SONIVOX_LOCATION: ${{github.workspace}}/SonivoxV4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "x86_64", altarch: "x64", os: "ubuntu-24.04" }
          - { arch: "aarch64", altarch: "arm64", os: "ubuntu-24.04-arm" }
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: dawidd6/action-download-artifact@v28
      with:
        name: ${{env.SONIVOXNAME}}-Linux-${{matrix.altarch}}-r44s16
        github_token: ${{secrets.GH_PAT}}
        repo: EmbeddedSynth/sonivox
        allow_forks: false
        workflow: linux-ci.yml
        branch: devel

    - name: Extract downloaded Sonivox files
      run: tar xvf ${{env.SONIVOXNAME}}.tar

    - uses: dawidd6/action-download-artifact@v28
      with:
        name: ${{env.DRUMSTICKNAME}}-${{matrix.arch}}.tar.gz
        github_token: ${{secrets.GH_PAT}}
        repo: pedrolcl/drumstick
        allow_forks: false
        workflow: linux.yml
        skip_unpack: true

    - name: Extract downloaded Drumstick files
      run: tar xvf ${{env.DRUMSTICKNAME}}-${{matrix.arch}}.tar.gz

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'

    - name: Dependencies
      run: sudo apt-get update && sudo apt-get install -yq pkg-config libasound2-dev libpulse-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_PREFIX_PATH="${{env.DRUMSTICK_LOCATION}};${{env.SONIVOX_LOCATION}}"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
